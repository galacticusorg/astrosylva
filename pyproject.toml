[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "astrosylva"
version = "0.1.0a1"
description = "Convert halo merger trees (Consistent-Trees, LHaloTree, SubLink, AHF) into the Galacticus HDF5 input format."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrew Benson", email = "abenson@carnegiescience.edu" },
]
keywords = ["cosmology", "halo", "merger-tree", "galacticus", "rockstar", "consistent-trees"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=1.24",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
    "types-PyYAML",
]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
    "myst-parser>=2.0",
]

[project.scripts]
astrosylva = "astrosylva.cli:main"

[project.entry-points."astrosylva.readers"]
consistent_trees = "astrosylva.readers.consistent_trees:ConsistentTreesReader"
lhalotree = "astrosylva.readers.lhalotree:LHaloTreeReader"
sublink = "astrosylva.readers.sublink:SubLinkReader"
ahf = "astrosylva.readers.ahf:AHFReader"

[project.urls]
Homepage = "https://github.com/galacticusorg/astrosylva"
Source = "https://github.com/galacticusorg/astrosylva"
Issues = "https://github.com/galacticusorg/astrosylva/issues"
Documentation = "https://astrosylva.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/astrosylva"]

[tool.hatch.build.targets.sdist]
include = [
    "src/astrosylva",
    "tests",
    "docs",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["rockstar2galacticus", "docs/_build"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF",
    "PL", "PT", "RET", "C4", "ARG",
]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["h5py.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
