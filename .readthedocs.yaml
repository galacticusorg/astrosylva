# Read the Docs configuration for astrosylva.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for the full spec.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Install the package + its docs extra so autodoc can import the modules
# and the Sphinx / Furo / MyST plugins are available.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - htmlzip
  - pdf
